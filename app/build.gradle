plugins { id 'com.android.application' }

android {
    namespace 'com.spectrumlab.s80'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spectrumlab.s80'
        minSdk 26
        targetSdk 27
        versionCode 2
        versionName '0.2.0-phase1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Phase 1 is deliberately dependency-free: only android.jar platform APIs are used.
// No INTERNET permission, no third-party libraries, no analytics, no network sinks (docs/06 ADR-003).
dependencies {
}
